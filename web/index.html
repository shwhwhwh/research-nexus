<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="__CSRF_TOKEN__">
  <meta name="color-scheme" content="light dark">
  <title>Research Nexus · 研究工作台</title>
  <script src="/appearance.js"></script>
  <link rel="icon" type="image/png" href="/icon.png"><link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/designer.css"><script src="/graph-layout.js" defer></script><script src="/designer.js" defer></script>
  <link rel="stylesheet" href="/systems.css"><script src="/systems.js" defer></script>
  <link rel="stylesheet" href="/auto-builder.css"><script src="/auto-builder.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img class="nexus-mark" src="/icon.png" alt=""><div>Research Nexus<small>你的研究，彼此连接。</small></div></div>
    <div class="nav-caption">工作空间</div>
    <nav>
      <button class="nav active" data-page="home"><span class="nav-icon">◫</span>工作台</button>
      <button class="nav" data-page="systems"><span class="nav-icon">⌘</span>系统模板<span class="nav-hint">01</span></button>
      <button class="nav" data-page="designer"><span class="nav-icon">◇</span>DIY 搭建<span class="nav-hint">Beta</span></button>
      <button class="nav" data-page="archive"><span class="nav-icon">▤</span>归档记录<span id="queue-count" class="nav-count">0</span></button>
      <button class="nav" data-page="library"><span class="nav-icon">▥</span>本地文献</button>
    </nav>
    <div class="nav-caption tools-caption">研究工具 <span>已连接</span></div>
    <nav>
      <button class="nav" data-tool="alpha"><span class="service-letter alpha-letter">α</span>alphaXiv<span class="nav-hint">发现</span></button>
      <button class="nav" data-tool="zotero"><span class="service-letter zotero-letter">Z</span>Zotero<span class="nav-hint">文献</span></button>
      <button class="nav" data-tool="openresearch" title="OpenResearch 本地应用"><span class="service-letter orx-letter">◩</span>OpenResearch<span class="nav-hint">研究</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="appearance-picker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg><label class="sr-only" for="theme-select">外观</label><select id="theme-select" title="外观"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div>
      <button class="nav" data-page="settings"><span class="nav-icon">⚙</span>连接与设置</button>
      <div class="local-indicator"><span class="status-dot"></span>本地工作空间<small>收藏 → 去重 → 归档</small><small class="design-credit">字体与排版参考 Codex 桌面端</small></div>
    </div>
  </aside>
  <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong id="page-title">工作台</strong></div>
    <div id="tool-controls" class="hidden"><button class="icon-button" id="tool-back" aria-label="后退">←</button><button class="icon-button" id="tool-reload" aria-label="刷新页面">↻</button><button class="icon-button" id="tool-fullscreen" title="全屏 / 退出全屏（F11）" aria-label="全屏（F11）">⛶ F11</button><button class="icon-button hidden" id="tool-window" title="在独立窗口中打开当前应用">独立窗口</button><span id="tool-address"></span></div>
    <div class="top-actions"><span id="sync-indicator" class="pill">等待连接</span><button class="button primary" id="sync-button">↻ 立即归档</button></div>
  </header>
  <div class="window-controls" aria-label="窗口操作"><button id="window-minimize" aria-label="最小化" title="最小化"><svg viewBox="0 0 12 12"><path d="M1 6h10"/></svg></button><button id="window-maximize" aria-label="最大化或还原" title="最大化 / 还原"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1"/></svg></button><button id="window-close" aria-label="隐藏到托盘" title="隐藏到托盘"><svg viewBox="0 0 12 12"><path d="m2 2 8 8m0-8-8 8"/></svg></button></div>
  <main id="main"></main>
  <div id="toast" role="status" class="toast hidden"></div>
</body>
</html>
